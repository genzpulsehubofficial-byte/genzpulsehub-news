name = "genzpulsehub-ads"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
SITE_URL = "https://genzpulsehub.pages.dev"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "genzpulsehub-ads"
database_id = "__D1_ID__"

[triggers]
crons = ["30 3 * * *"]   # 9:00 IST daily
