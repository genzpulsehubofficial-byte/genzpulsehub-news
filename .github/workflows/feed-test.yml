name: feed-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en" "https://news.google.com/rss/search?q=Kerala+PSC&hl=en-IN&gl=IN&ceid=IN:en" "https://www.onmanorama.com/news/kerala.feeds.onmfeed.xml" "https://www.bing.com/news/search?q=Kerala+PSC&format=rss" "https://feeds.feedburner.com/ndtvnews-top-stories"; do
            echo "$(curl -s -o /tmp/f -w '%{http_code}' -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36' -L "$u") $(grep -c '<item' /tmp/f) $u"; done
