name: ads-deploy

on:
  push:
    paths: ["workers/ads/**", ".github/workflows/ads-deploy.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: workers/ads
    steps:
      - uses: actions/checkout@v4
      - name: Create D1 database if missing
        run: |
          ID=$(npx -y wrangler@4 d1 list --json | python3 -c "import json,sys;d=[x for x in json.load(sys.stdin) if x['name']=='genzpulsehub-ads'];print(d[0]['uuid'] if d else '')")
          if [ -z "$ID" ]; then npx -y wrangler@4 d1 create genzpulsehub-ads >/dev/null; ID=$(npx -y wrangler@4 d1 list --json | python3 -c "import json,sys;print([x for x in json.load(sys.stdin) if x['name']=='genzpulsehub-ads'][0]['uuid'])"); fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx -y wrangler@4 d1 execute genzpulsehub-ads --remote --file=schema.sql
      - name: Deploy worker
        run: npx -y wrangler@4 deploy
      - name: Set worker secrets
        run: |
          echo "${{ secrets.CASHFREE_APP_ID }}" | npx -y wrangler@4 secret put CASHFREE_APP_ID
          echo "${{ secrets.CASHFREE_SECRET_KEY }}" | npx -y wrangler@4 secret put CASHFREE_SECRET_KEY
          echo "${{ secrets.DISCORD_WEBHOOK_URL }}" | npx -y wrangler@4 secret put DISCORD_WEBHOOK_URL
