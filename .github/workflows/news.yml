name: news

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, rewrite, save
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/main.py
      - name: Commit new stories
        run: |
          git config user.name "genzpulsehub-bot"
          git config user.email "genzpulsehub.official@gmail.com"
          git add data
          git diff --cached --quiet || git commit -m "news: $(date -u +%H:%M) UTC"
          git pull --rebase -q || true
          git push -q
      - name: Alert on crash
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -d "{\"content\":\"@everyone 🚨 News pipeline crashed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"allowed_mentions\":{\"parse\":[\"everyone\"]}}" "$DISCORD_WEBHOOK_URL"
