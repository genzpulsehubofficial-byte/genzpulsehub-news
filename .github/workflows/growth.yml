name: growth
on:
  schedule:
    - cron: "17,47 * * * *"     # comment auto-replies
    - cron: "30 15 * * *"       # daily report + auto-tune (9 PM IST)
    - cron: "0 20 * * 0"        # weekly backup (Mon 1:30 AM IST)
  workflow_dispatch:
    inputs:
      job: {description: "engage | insights | backup", default: "engage"}
concurrency: growth
permissions: {contents: write, actions: read, models: read}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: Pick job
        id: j
        run: |
          J="${{ github.event.inputs.job }}"
          if [ -z "$J" ]; then case "${{ github.event.schedule }}" in "30 15 * * *") J=insights;; "0 20 * * 0") J=backup;; *) J=engage;; esac; fi
          echo "job=$J" >> $GITHUB_OUTPUT
      - name: Run
        if: steps.j.outputs.job != 'backup'
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_EN: ${{ secrets.YT_REFRESH_EN }}
          YT_REFRESH_ML: ${{ secrets.YT_REFRESH_ML }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.j.outputs.job }}" = insights ]; then python growth/insights.py; else python growth/engage.py; fi
      - name: Backup (data + ad database) as a GitHub release
        if: steps.j.outputs.job == 'backup'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          D=$(date +%Y-%m-%d)
          npx -y wrangler@4 d1 export genzpulsehub-ads --remote --output ads-db.sql || echo "d1 export skipped"
          tar czf backup-$D.tgz data ads-db.sql 2>/dev/null || tar czf backup-$D.tgz data
          gh release create backup-$D backup-$D.tgz --title "Backup $D" --notes "Weekly automatic backup" || true
          gh release list --limit 100 | awk '/^Backup/{print $3}' | tail -n +9 | xargs -r -n1 gh release delete -y --cleanup-tag
      - name: Save state
        if: always() && steps.j.outputs.job != 'backup'
        run: |
          git config user.name genzpulsehub-bot; git config user.email bot@genzpulsehub
          git add data/replied.json data/weights.json data/analytics 2>/dev/null; git diff --cached --quiet || git commit -m "growth: state"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - if: failure()
        run: curl -s -H "Content-Type: application/json" -d '{"content":"@everyone ⚠️ growth job failed (${{ steps.j.outputs.job }})"}' "${{ secrets.DISCORD_WEBHOOK_URL }}"
