name: fb-live-test
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env: {T: "${{ secrets.META_TOKEN }}"}
        run: |
          python3 - <<'P'
          import os, json, urllib.request, urllib.parse
          G="https://graph.facebook.com/v21.0"
          def call(path, data=None, method=None):
              url=G+path
              if data is not None: data=urllib.parse.urlencode(data).encode()
              try: return json.load(urllib.request.urlopen(urllib.request.Request(url,data=data,method=method),timeout=30))
              except urllib.error.HTTPError as e: return json.load(e)
          pages=call("/me/accounts?fields=name,id,access_token&access_token="+os.environ["T"])
          for p in pages.get("data",[]):
              lv=call(f"/{p['id']}/live_videos", {"status":"UNPUBLISHED","title":"test","access_token":p["access_token"]})
              ok = "stream_url" in lv or "secure_stream_url" in lv or "id" in lv
              print(p["name"], "create:", "OK" if ok else lv.get("error",{}).get("message"))
              if "id" in lv:
                  d=call(f"/{lv['id']}?access_token="+p["access_token"], method="DELETE"); print("  cleanup:", d)
          P
