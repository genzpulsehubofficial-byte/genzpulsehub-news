name: shorts-preview
on: workflow_dispatch
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-ui-core libraqm0 >/dev/null
      - run: pip install -q -U edge-tts gTTS requests pillow feedparser
      - name: Render one EN + one ML (no posting)
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd shorts && python - <<'P'
          import json, os, sys
          sys.path.insert(0, "../pipeline")
          import explainer, main as pl
          en = json.load(open("../data/latest_en.json"))
          ml = {x["id"]: x for x in json.load(open("../data/latest_ml.json"))}
          s = next((x for x in en if x["id"] in ml), en[0])
          bt = s.get("beats")
          if not bt:
              bt = pl.make_beats({"en": s}); print("beats:", json.dumps(bt, ensure_ascii=False)[:1500])
          for lang in ("en", "ml"):
              x = dict(ml.get(s["id"], s) if lang == "ml" else s)
              if bt: x["beats"] = bt
              print(lang, explainer.render(lang, x, f"../out/preview/{lang}"))
          json.dump(bt, open("../out/beats.json", "w"))
          P
          for f in ../out/preview/*/*.mp4; do ffmpeg -loglevel error -y -ss 3 -i "$f" -frames:v 1 "${f%.mp4}_3s.jpg"; ffmpeg -loglevel error -y -sseof -1.5 -i "$f" -frames:v 1 "${f%.mp4}_end.jpg"; done
      - name: Render one LIVE segment per language (16:9)
        env: {PIXABAY_API_KEY: "${{ secrets.PIXABAY_API_KEY }}"}
        run: |
          mkdir -p out/preview/live
          for L in en ml; do python - "$L" <<'P'
          import sys, json, os
          sys.argv = ["engine.py", sys.argv[1]]
          sys.path.insert(0, "stream")
          import engine
          s = json.load(open(f"data/latest_{engine.LANG}.json"))[0]
          try: s["beats"] = json.load(open("out/beats.json"))
          except Exception: pass
          if engine.LANG == "ml":
              en0 = json.load(open("data/latest_en.json")); ml = {x["id"]: x for x in json.load(open("data/latest_ml.json"))}
              s = dict(ml.get(next((x["id"] for x in en0 if x["id"] in ml), ""), s), beats=s.get("beats"))
          engine.segment_explainer(s, "Next story headline here", engine.ad_text(), f"out/preview/live/{engine.LANG}.ts", 1.0)
          P
          ffmpeg -loglevel error -y -ss 4 -i out/preview/live/$L.ts -frames:v 1 out/preview/live/${L}_4s.jpg; done
      - uses: actions/upload-artifact@v4
        with: {name: preview, path: out/preview}
